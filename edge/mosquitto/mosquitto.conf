# Broker MQTT do nó de borda — aceita SOMENTE conexões mTLS (RT-04)
listener 8883
tls_version tlsv1.2

# Identidade do broker e cadeia de confiança (CA do projeto + CRL — RT-05)
cafile   /mosquitto/pki/ca.crt
crlfile  /mosquitto/pki/ca.crl
certfile /mosquitto/certs/broker.crt
keyfile  /mosquitto/certs/broker.key

# Todo cliente precisa apresentar certificado válido; o CN vira o usuário.
# Não existe senha nem segredo compartilhado entre dispositivos.
require_certificate true
use_identity_as_username true
allow_anonymous false

# Menor privilégio por dispositivo
acl_file /mosquitto/config/acl

# Mensagens QoS 1 sobrevivem a reinícios do broker
persistence true
persistence_location /mosquitto/data/

# Logs em stdout (coletados pelo SIEM na Fase 5)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ
