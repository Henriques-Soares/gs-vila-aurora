# Rede Comunitária Vila Aurora — laboratório completo (FIAP Global Solution 2026.2)
#
#   1) docker compose run --rm --build setup   gera PKI, segredos e chaves da VPN (só cria o que falta)
#   2) docker compose up -d --build            sobe campo, borda, nuvem e supervisão
#
# Camadas e segmentos de rede (RT-01 / RT-06 / RT-07):
#   campo-<espaco>  rede isolada de cada espaço: dispositivos + broker + nó de borda
#   wan             enlace não confiável borda <-> nuvem: nele só trafega WireGuard (UDP 51820)
#   túnel 10.8.0.0/24  VPN WireGuard: a ingestão da nuvem só escuta em 10.8.0.1
#   nuvem           serviços internos da nuvem (banco inalcançável pela borda)
#   operadores      único segmento com porta publicada (painel, só em 127.0.0.1)
name: vila-aurora

x-python-campo: &campo
  build: ./field
  image: vila-aurora/campo
  restart: unless-stopped

x-broker: &broker
  image: eclipse-mosquitto:2.0
  restart: unless-stopped

x-agente: &agente
  build: ./edge/agente
  image: vila-aurora/agente-borda
  restart: unless-stopped

x-vpn: &vpn
  build: ./vpn
  image: vila-aurora/vpn
  restart: unless-stopped
  init: true
  cap_add: [NET_ADMIN]   # necessário para criar a interface wg0 dentro do container

services:
  # ---------------------------------------------------------------- ferramentas
  setup:
    profiles: ["ferramentas"]
    build: ./pki
    image: vila-aurora/pki
    volumes: ["./:/repo"]
    entrypoint: ["bash", "/repo/pki/setup.sh"]

  pki:
    profiles: ["ferramentas"]
    build: ./pki
    image: vila-aurora/pki
    volumes: ["./:/repo"]
    entrypoint: ["bash", "/repo/pki/pki.sh"]

  ia:                     # IA defensiva (RT-16/17): anomalia.py | guardrioes_demo.py | anomalia.py --banco
    profiles: ["ferramentas"]
    build: ./ia
    image: vila-aurora/ia
    env_file:
      - path: ./segredos/painel.env
        required: false
    networks: [nuvem]
    entrypoint: ["python"]
    command: ["anomalia.py"]
    depends_on:
      nuvem-db:
        condition: service_healthy

  admin:                  # contas do painel: migrar | semear | listar | criar | redefinir
    profiles: ["ferramentas"]
    build: ./painel
    image: vila-aurora/painel
    env_file:
      - path: ./segredos/db.env
        required: false
    volumes: ["./cloud/db:/db:ro"]
    networks: [nuvem]
    entrypoint: ["python", "admin.py"]
    depends_on:
      nuvem-db:
        condition: service_healthy

  # ---------------------------------------------------------------- espaço: centro
  campo-centro:
    <<: *campo
    environment:
      ESPACO: centro
      BROKER_HOST: borda-centro-broker
    volumes:
      - ./pki/out/publico:/pki/publico:ro
      - ./pki/out/dispositivos/centro:/pki/dispositivos:ro
    networks: [campo-centro]
    depends_on: [borda-centro-broker]

  borda-centro-broker:
    <<: *broker
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./edge/mosquitto/acl/centro.acl:/mosquitto/config/acl:ro
      - ./pki/out/publico:/mosquitto/pki:ro
      - ./pki/out/bordas/centro/broker:/mosquitto/certs:ro
      - broker-centro:/mosquitto/data
    networks: [campo-centro]

  borda-centro-vpn:          # ponta do túnel WireGuard deste nó de borda
    <<: *vpn
    environment:
      WG_ENDERECO: 10.8.0.11/24
    volumes:
      - ./segredos/wg/centro:/wg:ro
    extra_hosts:
      - "nuvem-ingest:10.8.0.1"   # a ingestão só existe dentro do túnel
    networks: [campo-centro, wan]
    depends_on: [nuvem-vpn]

  borda-centro-agente:
    <<: *agente
    network_mode: "service:borda-centro-vpn"   # usa a rede do nó de borda: fala com a nuvem só pelo túnel
    environment:
      ESPACO: centro
      BROKER_HOST: borda-centro-broker
      INGEST_URL: https://nuvem-ingest:8443/ingest
    volumes:
      - ./pki/out/publico:/pki/publico:ro
      - ./pki/out/bordas/centro/agente:/pki/agente:ro
      - buffer-centro:/dados
    depends_on: [borda-centro-vpn, borda-centro-broker]

  # ---------------------------------------------------------------- espaço: escola
  campo-escola:
    <<: *campo
    environment:
      ESPACO: escola
      BROKER_HOST: borda-escola-broker
    volumes:
      - ./pki/out/publico:/pki/publico:ro
      - ./pki/out/dispositivos/escola:/pki/dispositivos:ro
    networks: [campo-escola]
    depends_on: [borda-escola-broker]

  borda-escola-broker:
    <<: *broker
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./edge/mosquitto/acl/escola.acl:/mosquitto/config/acl:ro
      - ./pki/out/publico:/mosquitto/pki:ro
      - ./pki/out/bordas/escola/broker:/mosquitto/certs:ro
      - broker-escola:/mosquitto/data
    networks: [campo-escola]

  borda-escola-vpn:          # ponta do túnel WireGuard deste nó de borda
    <<: *vpn
    environment:
      WG_ENDERECO: 10.8.0.12/24
    volumes:
      - ./segredos/wg/escola:/wg:ro
    extra_hosts:
      - "nuvem-ingest:10.8.0.1"   # a ingestão só existe dentro do túnel
    networks: [campo-escola, wan]
    depends_on: [nuvem-vpn]

  borda-escola-agente:
    <<: *agente
    network_mode: "service:borda-escola-vpn"   # usa a rede do nó de borda: fala com a nuvem só pelo túnel
    environment:
      ESPACO: escola
      BROKER_HOST: borda-escola-broker
      INGEST_URL: https://nuvem-ingest:8443/ingest
    volumes:
      - ./pki/out/publico:/pki/publico:ro
      - ./pki/out/bordas/escola/agente:/pki/agente:ro
      - buffer-escola:/dados
    depends_on: [borda-escola-vpn, borda-escola-broker]

  # ---------------------------------------------------------------- espaço: ubs
  campo-ubs:
    <<: *campo
    environment:
      ESPACO: ubs
      BROKER_HOST: borda-ubs-broker
    volumes:
      - ./pki/out/publico:/pki/publico:ro
      - ./pki/out/dispositivos/ubs:/pki/dispositivos:ro
    networks: [campo-ubs]
    depends_on: [borda-ubs-broker]

  borda-ubs-broker:
    <<: *broker
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./edge/mosquitto/acl/ubs.acl:/mosquitto/config/acl:ro
      - ./pki/out/publico:/mosquitto/pki:ro
      - ./pki/out/bordas/ubs/broker:/mosquitto/certs:ro
      - broker-ubs:/mosquitto/data
    networks: [campo-ubs]

  borda-ubs-vpn:          # ponta do túnel WireGuard deste nó de borda
    <<: *vpn
    environment:
      WG_ENDERECO: 10.8.0.13/24
    volumes:
      - ./segredos/wg/ubs:/wg:ro
    extra_hosts:
      - "nuvem-ingest:10.8.0.1"   # a ingestão só existe dentro do túnel
    networks: [campo-ubs, wan]
    depends_on: [nuvem-vpn]

  borda-ubs-agente:
    <<: *agente
    network_mode: "service:borda-ubs-vpn"   # usa a rede do nó de borda: fala com a nuvem só pelo túnel
    environment:
      ESPACO: ubs
      BROKER_HOST: borda-ubs-broker
      INGEST_URL: https://nuvem-ingest:8443/ingest
    volumes:
      - ./pki/out/publico:/pki/publico:ro
      - ./pki/out/bordas/ubs/agente:/pki/agente:ro
      - buffer-ubs:/dados
    depends_on: [borda-ubs-vpn, borda-ubs-broker]

  # ---------------------------------------------------------------- espaço: horta
  campo-horta:
    <<: *campo
    environment:
      ESPACO: horta
      BROKER_HOST: borda-horta-broker
    volumes:
      - ./pki/out/publico:/pki/publico:ro
      - ./pki/out/dispositivos/horta:/pki/dispositivos:ro
    networks: [campo-horta]
    depends_on: [borda-horta-broker]

  borda-horta-broker:
    <<: *broker
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./edge/mosquitto/acl/horta.acl:/mosquitto/config/acl:ro
      - ./pki/out/publico:/mosquitto/pki:ro
      - ./pki/out/bordas/horta/broker:/mosquitto/certs:ro
      - broker-horta:/mosquitto/data
    networks: [campo-horta]

  borda-horta-vpn:          # ponta do túnel WireGuard deste nó de borda
    <<: *vpn
    environment:
      WG_ENDERECO: 10.8.0.14/24
    volumes:
      - ./segredos/wg/horta:/wg:ro
    extra_hosts:
      - "nuvem-ingest:10.8.0.1"   # a ingestão só existe dentro do túnel
    networks: [campo-horta, wan]
    depends_on: [nuvem-vpn]

  borda-horta-agente:
    <<: *agente
    network_mode: "service:borda-horta-vpn"   # usa a rede do nó de borda: fala com a nuvem só pelo túnel
    environment:
      ESPACO: horta
      BROKER_HOST: borda-horta-broker
      INGEST_URL: https://nuvem-ingest:8443/ingest
    volumes:
      - ./pki/out/publico:/pki/publico:ro
      - ./pki/out/bordas/horta/agente:/pki/agente:ro
      - buffer-horta:/dados
    depends_on: [borda-horta-vpn, borda-horta-broker]

  # ---------------------------------------------------------------- espaço: abrigo
  campo-abrigo:
    <<: *campo
    environment:
      ESPACO: abrigo
      BROKER_HOST: borda-abrigo-broker
    volumes:
      - ./pki/out/publico:/pki/publico:ro
      - ./pki/out/dispositivos/abrigo:/pki/dispositivos:ro
    networks: [campo-abrigo]
    depends_on: [borda-abrigo-broker]

  borda-abrigo-broker:
    <<: *broker
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./edge/mosquitto/acl/abrigo.acl:/mosquitto/config/acl:ro
      - ./pki/out/publico:/mosquitto/pki:ro
      - ./pki/out/bordas/abrigo/broker:/mosquitto/certs:ro
      - broker-abrigo:/mosquitto/data
    networks: [campo-abrigo]

  borda-abrigo-vpn:          # ponta do túnel WireGuard deste nó de borda
    <<: *vpn
    environment:
      WG_ENDERECO: 10.8.0.15/24
    volumes:
      - ./segredos/wg/abrigo:/wg:ro
    extra_hosts:
      - "nuvem-ingest:10.8.0.1"   # a ingestão só existe dentro do túnel
    networks: [campo-abrigo, wan]
    depends_on: [nuvem-vpn]

  borda-abrigo-agente:
    <<: *agente
    network_mode: "service:borda-abrigo-vpn"   # usa a rede do nó de borda: fala com a nuvem só pelo túnel
    environment:
      ESPACO: abrigo
      BROKER_HOST: borda-abrigo-broker
      INGEST_URL: https://nuvem-ingest:8443/ingest
    volumes:
      - ./pki/out/publico:/pki/publico:ro
      - ./pki/out/bordas/abrigo/agente:/pki/agente:ro
      - buffer-abrigo:/dados
    depends_on: [borda-abrigo-vpn, borda-abrigo-broker]

  # ---------------------------------------------------------------- nuvem
  nuvem-vpn:              # concentrador WireGuard: única porta da nuvem visível na wan (UDP 51820)
    <<: *vpn
    environment:
      WG_ENDERECO: 10.8.0.1/24
    volumes:
      - ./segredos/wg/nuvem:/wg:ro
    sysctls:
      net.ipv4.ip_forward: 0   # sem roteamento: um nó de borda não alcança outro pelo túnel
    networks: [wan, nuvem]
    healthcheck:
      test: ["CMD-SHELL", "ip -4 addr show wg0 | grep -q 10.8.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20

  nuvem-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vilaaurora
    env_file:
      - path: ./segredos/db.env
        required: false
    volumes:
      - ./cloud/db:/docker-entrypoint-initdb.d:ro
      - db:/var/lib/postgresql/data
    networks: [nuvem]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vilaaurora"]
      interval: 5s
      timeout: 3s
      retries: 20

  nuvem-ingest:
    build: ./cloud/ingest
    image: vila-aurora/nuvem-ingest
    restart: unless-stopped
    network_mode: "service:nuvem-vpn"   # mesma pilha de rede do concentrador
    environment:
      ESCUTA: 10.8.0.1                  # escuta somente no endereço do túnel
      SIEM_ADDR: siem:5514
    env_file:
      - path: ./segredos/ingest.env
        required: false
    volumes:
      - ./pki/out/publico:/pki/publico:ro
      - ./pki/out/nuvem/ingest:/pki/ingest:ro
    depends_on:
      nuvem-vpn:
        condition: service_healthy
      nuvem-db:
        condition: service_healthy

  # ---------------------------------------------------------------- SIEM
  siem:
    build: ./siem
    image: vila-aurora/siem
    restart: unless-stopped
    env_file:
      - path: ./segredos/siem.env
        required: false
    networks: [nuvem]          # recebe eventos da nuvem; não abre caminho novo entre segmentos
    depends_on:
      nuvem-db:
        condition: service_healthy

  # ---------------------------------------------------------------- supervisão
  painel:
    build: ./painel
    image: vila-aurora/painel
    restart: unless-stopped
    environment:
      TZ: "<-03>3"   # horário de Brasília na exibição
      SIEM_ADDR: siem:5514
    env_file:
      - path: ./segredos/painel.env
        required: false
    ports:
      - "127.0.0.1:8080:8080"   # só a própria máquina acessa; nada exposto à rede
    networks: [nuvem, operadores]
    depends_on:
      nuvem-db:
        condition: service_healthy

networks:
  campo-centro:
    internal: true
  campo-escola:
    internal: true
  campo-ubs:
    internal: true
  campo-horta:
    internal: true
  campo-abrigo:
    internal: true
  wan:
    internal: true
  nuvem:
    internal: true
  operadores: {}

volumes:
  broker-centro:
  buffer-centro:
  broker-escola:
  buffer-escola:
  broker-ubs:
  buffer-ubs:
  broker-horta:
  buffer-horta:
  broker-abrigo:
  buffer-abrigo:
  db:
